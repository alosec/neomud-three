<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeoMud Three Lab</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="app">
    <canvas id="scene"></canvas>
    <div class="crosshair" id="crosshair"></div>
    <div class="interaction-prompt hidden" id="interaction-prompt" aria-live="polite"></div>

    <section class="player-hud" id="player-hud" aria-label="Player status">
      <div class="hp-row">
        <span>HP</span>
        <strong id="hp-value">86/86</strong>
      </div>
      <div class="hp-track" aria-hidden="true">
        <span id="hp-fill"></span>
      </div>
      <div class="hp-row mp-row">
        <span>MP</span>
        <strong id="mp-value">18/18</strong>
      </div>
      <div class="hp-track mp-track" aria-hidden="true">
        <span id="mp-fill"></span>
      </div>
      <div class="pickup-feedback hidden" id="pickup-feedback" aria-live="polite">
        <strong id="pickup-feedback-title"></strong>
        <span id="pickup-feedback-detail"></span>
      </div>
      <div class="event-feedback hidden" id="event-feedback" aria-live="polite">
        <strong id="event-feedback-title"></strong>
        <span id="event-feedback-detail"></span>
      </div>
      <div class="movement-chip" id="movement-chip">Walk</div>
    </section>

    <section class="room-panel" id="room-panel">
      <div class="eyebrow">NeoMud Three Lab</div>
      <h1 id="room-name">Loading...</h1>
      <p id="room-description"></p>
      <div class="exits" id="room-exits"></div>
    </section>

    <section class="mode-panel" id="mode-panel">
      <button class="play-button" id="play-button" type="button">Play</button>
      <button class="menu-button" id="menu-button" type="button">Menu</button>
      <div class="camera-toggle" id="camera-toggle" aria-label="Camera view mode">
        <button class="camera-mode-button active" type="button" data-camera-mode="platform">Platform</button>
        <button class="camera-mode-button" type="button" data-camera-mode="isometric">Iso</button>
      </div>
      <span class="mode-label" id="mode-label">Menu</span>
    </section>

    <section class="atlas-panel">
      <div class="eyebrow">World</div>
      <div id="world-count">Loading world...</div>
      <div id="room-count">-</div>
      <div class="nav-cluster" aria-label="Navigation">
        <div class="mini-map" id="mini-map"></div>
        <div class="compass" id="compass" aria-label="Compass">
          <span class="compass-cardinal north">N</span>
          <span class="compass-cardinal east">E</span>
          <span class="compass-cardinal south">S</span>
          <span class="compass-cardinal west">W</span>
          <span class="compass-needle" id="compass-needle"></span>
        </div>
      </div>
      <div class="hint" id="status-text">WASD or arrow keys to walk. Cross the north doorway.</div>
    </section>

    <section class="game-panel hidden" id="game-panel" aria-live="polite">
      <header class="game-panel-header">
        <div>
          <div class="eyebrow" id="panel-eyebrow">NeoMud</div>
          <h2 id="panel-title">Panel</h2>
        </div>
        <button class="panel-close" id="panel-close" type="button" aria-label="Close panel">x</button>
      </header>
      <div class="game-panel-content" id="panel-content"></div>
    </section>
  </main>

  <template id="nameplate-template">
    <button class="nameplate" type="button"></button>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
